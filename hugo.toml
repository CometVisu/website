baseURL = 'https://cometvisu.github.io/'
locale = 'en'
defaultContentLanguage = 'en'
title = 'CometVisu - Smarthome Visualization'

[params]
  description = "Flexible, customizable smarthome visualization for KNX, OpenHAB and more"
  author = "CometVisu Team"
  githubRepo = "https://github.com/CometVisu/CometVisu"
  # Version path depends on CometVisu submodule branch: "latest" for master, "develop" for develop
  versionPath = "develop"
  docsBaseUrl = "https://www.cometvisu.org/CometVisu"

[languages]
  [languages.en]
    weight = 1
    title = "CometVisu - Smarthome Visualization"
    [languages.en.params]
      label = "English"
      description = "Flexible, customizable smarthome visualization for KNX, OpenHAB and more"
  [languages.de]
    weight = 2
    title = "CometVisu - Smarthome Visualisierung"
    [languages.de.params]
      label = "Deutsch"
      description = "Flexible, anpassbare Smarthome-Visualisierung für KNX, OpenHAB und mehr"

[menu]
  [[menu.main]]
    name = "Features"
    url = "#features"
    weight = 1
  [[menu.main]]
    name = "Anpassung"
    url = "#customization"
    weight = 2
  [[menu.main]]
    name = "Demo"
    url = "#demo"
    weight = 3
  [[menu.main]]
    name = "Aktuelles"
    url = "news/"
    weight = 4
  [[menu.main]]
    name = "Dokumentation"
    url = "https://www.cometvisu.org/CometVisu/de/latest/manual"
    weight = 5
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/CometVisu/CometVisu"
    weight = 6

[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/docs/de/1.0"
    target = "static/docs/de/latest"
  [[module.mounts]]
    source = "static/docs/en/1.0"
    target = "static/docs/en/latest"